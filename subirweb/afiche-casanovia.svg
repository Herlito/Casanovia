<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1620" width="1080" height="1620">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="50%" stop-color="#F3EFEA" />
      <stop offset="100%" stop-color="#EBE5DC" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>

    <!-- Rose Gold / Warm Gradient -->
    <linearGradient id="roseGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9A78F" />
      <stop offset="100%" stop-color="#B87B64" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="8" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.06" />
      <feDropShadow dx="-6" dy="-6" stdDeviation="10" flood-color="#FFFFFF" flood-opacity="0.9" />
    </filter>

    <!-- Subtle Glow for Badges -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#D4AF37" flood-opacity="0.25" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');
      
      .brand-title { font-family: 'Cormorant Garamond', serif; font-size: 56px; font-weight: 700; letter-spacing: 12px; fill: #242220; text-anchor: middle; }
      .brand-tag { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 5px; fill: #A37F46; text-anchor: middle; text-transform: uppercase; }
      .headline { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 600; fill: #2C2825; text-anchor: middle; }
      .headline-italic { font-style: italic; fill: #B87B64; }
      .subhead { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 16px; font-weight: 500; fill: #6B655F; text-anchor: middle; }
      
      .card-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700; fill: #242220; }
      .card-desc { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 400; fill: #665F58; line-height: 1.45; }
      .card-badge { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #8C6239; letter-spacing: 1px; }

      .footer-cta { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .footer-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 500; fill: #7E7770; text-anchor: middle; }
      .footer-web { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 700; fill: #2C2825; letter-spacing: 2px; text-anchor: middle; }
    </style>
  </defs>

  <!-- Canvas Background (2:3 Aspect Ratio: 1080 x 1620) -->
  <rect width="1080" height="1620" fill="url(#bgGrad)" />

  <!-- Elegant Outer Border Lines -->
  <rect x="36" y="36" width="1008" height="1548" rx="28" fill="none" stroke="#D1C7BA" stroke-width="1.2" stroke-opacity="0.6" />
  <rect x="46" y="46" width="988" height="1528" rx="22" fill="none" stroke="#EADFD0" stroke-width="0.8" />

  <!-- Delicate Corner Botanical Ornaments -->
  <g stroke="#C2B29F" stroke-width="1.2" fill="none" opacity="0.65">
    <!-- Top Left -->
    <path d="M50 90 Q 75 75 90 50" />
    <circle cx="95" cy="45" r="2.5" fill="#D4AF37" />
    <!-- Top Right -->
    <path d="M1030 90 Q 1005 75 990 50" />
    <circle cx="985" cy="45" r="2.5" fill="#D4AF37" />
    <!-- Bottom Left -->
    <path d="M50 1530 Q 75 1545 90 1570" />
    <circle cx="95" cy="1575" r="2.5" fill="#D4AF37" />
    <!-- Bottom Right -->
    <path d="M1030 1530 Q 1005 1545 990 1570" />
    <circle cx="985" cy="1575" r="2.5" fill="#D4AF37" />
  </g>

  <!-- ==================== HEADER SECTION ==================== -->
  <g transform="translate(540, 110)">
    <!-- Small Ring Emblem -->
    <g transform="translate(0, 0)">
      <circle cx="-10" cy="0" r="16" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
      <circle cx="10" cy="0" r="16" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
      <!-- Diamond Sparkle -->
      <polygon points="10,-24 13,-18 19,-15 13,-12 10,-6 7,-12 1,-15 7,-18" fill="#D4AF37" />
    </g>

    <!-- Brand Tag -->
    <text y="42" class="brand-tag">PLATAFORMA INTEGRAL DE BODAS</text>

    <!-- Brand Title -->
    <text y="96" class="brand-title">CASANOVIA</text>

    <!-- Subtle Golden Divider -->
    <line x1="-120" y1="120" x2="120" y2="120" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="0" cy="120" r="4" fill="#D4AF37" />

    <!-- Main Catchy Hook Headline -->
    <text y="172" class="headline">
      Todo lo que necesitas para tu boda,
    </text>
    <text y="218" class="headline headline-italic">
      en un solo lugar
    </text>
    <text y="255" class="subhead">
      Gestiona, diseña y comparte cada detalle de tu gran día desde tu celular o computadora.
    </text>
  </g>

  <!-- ==================== 6 KEY FEATURE CARDS (GRID 2x3) ==================== -->

  <!-- CARD 1: WeddingCraft Design (Invitaciones) -->
  <g transform="translate(80, 420)" filter="url(#cardShadow)">
    <rect width="440" height="260" rx="20" fill="#FFFFFF" fill-opacity="0.82" stroke="#ECE5DA" stroke-width="1.2" />
    <!-- Icon Container -->
    <rect x="24" y="24" width="56" height="56" rx="14" fill="#FBF4ED" stroke="#F1DEC9" stroke-width="1" />
    <text x="52" y="60" font-size="28" text-anchor="middle">💌</text>
    <!-- Badge -->
    <rect x="94" y="26" width="168" height="22" rx="11" fill="#F4EAE0" />
    <text x="178" y="41" class="card-badge" text-anchor="middle">CREATIVIDAD TOTAL</text>
    <!-- Title & Desc -->
    <text x="94" y="74" class="card-title">WeddingCraft Design</text>
    <text x="24" y="116" class="card-desc">
      <tspan x="24" dy="0">Diseña invitaciones digitales interactivas</tspan>
      <tspan x="24" dy="22">a medida: agrega música, fotos, cuenta</tspan>
      <tspan x="24" dy="22">regresiva, fuentes elegantes y formas</tspan>
      <tspan x="24" dy="22">personalizadas con un clic.</tspan>
    </text>
    <!-- Small Pill -->
    <rect x="24" y="214" width="136" height="24" rx="8" fill="#F8F6F2" stroke="#E5DFD5" stroke-width="1" />
    <text x="92" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#7C7368" text-anchor="middle">✦ 100% Interactivo</text>
  </g>

  <!-- CARD 2: RSVP & Pases Digitales con QR -->
  <g transform="translate(560, 420)" filter="url(#cardShadow)">
    <rect width="440" height="260" rx="20" fill="#FFFFFF" fill-opacity="0.82" stroke="#ECE5DA" stroke-width="1.2" />
    <!-- Icon Container -->
    <rect x="24" y="24" width="56" height="56" rx="14" fill="#EDF7F4" stroke="#D3EBE4" stroke-width="1" />
    <text x="52" y="60" font-size="28" text-anchor="middle">🎟️</text>
    <!-- Badge -->
    <rect x="94" y="26" width="158" height="22" rx="11" fill="#E2F2EE" />
    <text x="173" y="41" class="card-badge" fill="#2E7D68" text-anchor="middle">CONTROL EN VIVO</text>
    <!-- Title & Desc -->
    <text x="94" y="74" class="card-title">Pases Digitales &amp; RSVP</text>
    <text x="24" y="116" class="card-desc">
      <tspan x="24" dy="0">Confirmación de asistencia instantánea,</tspan>
      <tspan x="24" dy="22">asignación de cupos familiares por pase</tspan>
      <tspan x="24" dy="22">y código QR exclusivo para control de</tspan>
      <tspan x="24" dy="22">acceso el día del evento.</tspan>
    </text>
    <!-- Small Pill -->
    <rect x="24" y="214" width="144" height="24" rx="8" fill="#F8F6F2" stroke="#E5DFD5" stroke-width="1" />
    <text x="96" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#7C7368" text-anchor="middle">✦ Código QR + Cupos</text>
  </g>

  <!-- CARD 3: Plano de Mesas Interactivo -->
  <g transform="translate(80, 710)" filter="url(#cardShadow)">
    <rect width="440" height="260" rx="20" fill="#FFFFFF" fill-opacity="0.82" stroke="#ECE5DA" stroke-width="1.2" />
    <!-- Icon Container -->
    <rect x="24" y="24" width="56" height="56" rx="14" fill="#F3EEFA" stroke="#E2D5F2" stroke-width="1" />
    <text x="52" y="60" font-size="28" text-anchor="middle">🪑</text>
    <!-- Badge -->
    <rect x="94" y="26" width="168" height="22" rx="11" fill="#EBE0F7" />
    <text x="178" y="41" class="card-badge" fill="#694196" text-anchor="middle">DISTRIBUCIÓN VIP</text>
    <!-- Title & Desc -->
    <text x="94" y="74" class="card-title">Plano de Mesas y Salón</text>
    <text x="24" y="116" class="card-desc">
      <tspan x="24" dy="0">Organiza mesas redondas, rectangulares,</tspan>
      <tspan x="24" dy="22">pista de baile y escenario. Asigna a cada</tspan>
      <tspan x="24" dy="22">invitado a su asiento exacto arrastrando</tspan>
      <tspan x="24" dy="22">fácilmente en pantalla.</tspan>
    </text>
    <!-- Small Pill -->
    <rect x="24" y="214" width="148" height="24" rx="8" fill="#F8F6F2" stroke="#E5DFD5" stroke-width="1" />
    <text x="98" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#7C7368" text-anchor="middle">✦ Drag &amp; Drop Visual</text>
  </g>

  <!-- CARD 4: Organizador de Tareas y Presupuesto -->
  <g transform="translate(560, 710)" filter="url(#cardShadow)">
    <rect width="440" height="260" rx="20" fill="#FFFFFF" fill-opacity="0.82" stroke="#ECE5DA" stroke-width="1.2" />
    <!-- Icon Container -->
    <rect x="24" y="24" width="56" height="56" rx="14" fill="#EFF5FB" stroke="#D3E4F6" stroke-width="1" />
    <text x="52" y="60" font-size="28" text-anchor="middle">📋</text>
    <!-- Badge -->
    <rect x="94" y="26" width="166" height="22" rx="11" fill="#DFECF9" />
    <text x="177" y="41" class="card-badge" fill="#2B5B84" text-anchor="middle">CERO ESTRÉS</text>
    <!-- Title & Desc -->
    <text x="94" y="74" class="card-title">Checklist y Cronograma</text>
    <text x="24" y="116" class="card-desc">
      <tspan x="24" dy="0">Lista de tareas paso a paso, control</tspan>
      <tspan x="24" dy="22">de presupuesto, pagos a proveedores y</tspan>
      <tspan x="24" dy="22">el cronograma minuto a minuto para que</tspan>
      <tspan x="24" dy="22">todo salga perfecto en el gran día.</tspan>
    </text>
    <!-- Small Pill -->
    <rect x="24" y="214" width="144" height="24" rx="8" fill="#F8F6F2" stroke="#E5DFD5" stroke-width="1" />
    <text x="96" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#7C7368" text-anchor="middle">✦ Tiempos &amp; Gastos</text>
  </g>

  <!-- CARD 5: Mesa de Regalos y Cuenta Bancaria -->
  <g transform="translate(80, 1000)" filter="url(#cardShadow)">
    <rect width="440" height="260" rx="20" fill="#FFFFFF" fill-opacity="0.82" stroke="#ECE5DA" stroke-width="1.2" />
    <!-- Icon Container -->
    <rect x="24" y="24" width="56" height="56" rx="14" fill="#FBF8EE" stroke="#F4ECD0" stroke-width="1" />
    <text x="52" y="60" font-size="28" text-anchor="middle">🎁</text>
    <!-- Badge -->
    <rect x="94" y="26" width="156" height="22" rx="11" fill="#F5EFCF" />
    <text x="172" y="41" class="card-badge" fill="#7C6B1B" text-anchor="middle">SIN COMISIONES</text>
    <!-- Title & Desc -->
    <text x="94" y="74" class="card-title">Mesa de Regalos &amp; Banco</text>
    <text x="24" y="116" class="card-desc">
      <tspan x="24" dy="0">Comparte tu cuenta bancaria para lluvia</tspan>
      <tspan x="24" dy="22">de sobres o transferencias directas,</tspan>
      <tspan x="24" dy="22">más enlaces a tiendas departamentales</tspan>
      <tspan x="24" dy="22">o lista de regalos preferida.</tspan>
    </text>
    <!-- Small Pill -->
    <rect x="24" y="214" width="142" height="24" rx="8" fill="#F8F6F2" stroke="#E5DFD5" stroke-width="1" />
    <text x="95" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#7C7368" text-anchor="middle">✦ Transferencia Fácil</text>
  </g>

  <!-- CARD 6: Muro de Deseos & Galería de Recuerdos -->
  <g transform="translate(560, 1000)" filter="url(#cardShadow)">
    <rect width="440" height="260" rx="20" fill="#FFFFFF" fill-opacity="0.82" stroke="#ECE5DA" stroke-width="1.2" />
    <!-- Icon Container -->
    <rect x="24" y="24" width="56" height="56" rx="14" fill="#FDF0F3" stroke="#F7D4DD" stroke-width="1" />
    <text x="52" y="60" font-size="28" text-anchor="middle">💖</text>
    <!-- Badge -->
    <rect x="94" y="26" width="158" height="22" rx="11" fill="#F7E0E6" />
    <text x="173" y="41" class="card-badge" fill="#913B56" text-anchor="middle">EMOTIVO Y VIVO</text>
    <!-- Title & Desc -->
    <text x="94" y="74" class="card-title">Muro de Deseos &amp; Fotos</text>
    <text x="24" y="116" class="card-desc">
      <tspan x="24" dy="0">Tus invitados pueden dejar dedicatorias</tspan>
      <tspan x="24" dy="22">emotivas, felicitaciones en vivo y</tspan>
      <tspan x="24" dy="22">compartir sus mejores fotos de la fiesta</tspan>
      <tspan x="24" dy="22">en un libro digital interactivo.</tspan>
    </text>
    <!-- Small Pill -->
    <rect x="24" y="214" width="138" height="24" rx="8" fill="#F8F6F2" stroke="#E5DFD5" stroke-width="1" />
    <text x="93" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#7C7368" text-anchor="middle">✦ Recuerdos Vivos</text>
  </g>

  <!-- ==================== FOOTER / CALL TO ACTION ==================== -->
  <g transform="translate(540, 1315)">
    <!-- Feature Pill Ribbon -->
    <rect x="-380" y="0" width="760" height="42" rx="21" fill="#F0E9DF" stroke="#DFD4C5" stroke-width="1" />
    <text y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#6A6258" text-anchor="middle">
      ✓ Itinerario con Waze &amp; Google Maps &nbsp;•&nbsp; ✓ Código de Vestimenta &nbsp;•&nbsp; ✓ Multi-evento
    </text>

    <!-- Main Button CTA -->
    <g transform="translate(0, 75)" filter="url(#cardShadow)">
      <rect x="-240" y="0" width="480" height="66" rx="33" fill="#242220" />
      <!-- Subtle Gold Border on Button -->
      <rect x="-238" y="2" width="476" height="62" rx="31" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.8" />
      <text y="40" class="footer-cta">¡CREA TU BODA DIGITAL HOY!</text>
    </g>

    <!-- Web Link & Social -->
    <text y="185" class="footer-web">casanovia.com</text>
    <text y="212" class="footer-sub">Diseña • Organiza • Sorprende a tus invitados</text>

    <!-- Subtle Instagram Handle Badge -->
    <g transform="translate(0, 235)">
      <rect x="-100" y="0" width="200" height="26" rx="13" fill="#E8DFD3" />
      <text y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#585047" text-anchor="middle">
        📸 @casanovia.bodas
      </text>
    </g>
  </g>
</svg>
